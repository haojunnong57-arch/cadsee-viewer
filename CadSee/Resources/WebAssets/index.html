<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CAD 查看</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #141518;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #viewer {
    position: fixed;
    inset: 0;
    touch-action: none;
  }
  #viewer canvas {
    display: block;
  }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 13px;
    color: #9ca3af;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #status.hidden {
    opacity: 0;
  }
  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.14);
    border-top-color: #0a84ff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="status">
  <div class="spinner"></div>
  <div id="statusText">正在解析模型…</div>
</div>
<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script src="js/loaders/STLLoader.js"></script>
<script src="js/loaders/OBJLoader.js"></script>
<script src="js/loaders/PLYLoader.js"></script>
<script src="js/loaders/GLTFLoader.js"></script>
<script src="js/fflate.min.js"></script>
<script src="js/loaders/3MFLoader.js"></script>
<script src="js/occt/occt-import-js.js"></script>
<script src="js/dxf-parser.js"></script>
<script src="js/dxf-viewer.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
