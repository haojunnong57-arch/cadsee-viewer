workflows:
  build-ipa:
    name: CadSee iOS（未签名 IPA）
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build app (unsigned)
        script: |
          xcodebuild build \
            -project CadSee.xcodeproj \
            -scheme CadSee \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/CadSee.app Payload/
          zip -qry CadSee-unsigned.ipa Payload
    artifacts:
      - CadSee-unsigned.ipa
